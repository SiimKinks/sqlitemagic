plugins {
  id 'java-gradle-plugin'
  alias(libs.plugins.kotlin.jvm)
}

apply from: '../buildsystem/maven-push.gradle'
apply from: '../buildsystem/bintray-push.gradle'
apply from: '../buildsystem/sqlite-support.gradle'

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/pluginVersion/main/kotlin')
def pluginVersion = project.version.toString()
def generatePluginVersion = tasks.register('generatePluginVersion') {
  outputs.dir(generatedVersionDir)
  inputs.property('pluginVersion', pluginVersion)
  doLast {
    def packageDir = generatedVersionDir.get()
        .dir('com/siimkinks/sqlitemagic')
        .asFile
    packageDir.mkdirs()
    def versionFile = generatedVersionDir.get()
        .file('com/siimkinks/sqlitemagic/PluginVersion.kt')
        .asFile
    versionFile.text = """package com.siimkinks.sqlitemagic

internal const val PLUGIN_VERSION = "${pluginVersion}"
"""
  }
}

sourceSets {
  main {
    java.srcDir(generatedVersionDir)
  }
}

tasks.named('compileKotlin') {
  dependsOn(generatePluginVersion)
}

tasks.named('sourcesJar') {
  dependsOn(generatePluginVersion)
}

dependencies {
  compileOnly gradleApi()
  compileOnly libs.android.gradle
  compileOnly libs.ksp.gradle.plugin

  implementation project(':compiler')
  implementation project(':runtime')
  implementation project(':migration-testing')

  testImplementation platform(libs.junit.bom)
  testImplementation libs.junit.jupiter
  testImplementation gradleTestKit()
  testImplementation libs.truth
  testRuntimeOnly libs.junit.platform.launcher
}

gradlePlugin {
  plugins {
    sqlitemagic {
      id = 'com.siimkinks.sqlitemagic'
      implementationClass = 'com.siimkinks.sqlitemagic.SqliteMagicPlugin'
    }
  }
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  scanForTestClasses = false
}

tasks.named('test') {
  include '**/*Test.class'
  exclude '**/*IntegrationTest.class'
}

tasks.register('integrationTest', Test) {
  group = 'verification'
  description = 'Runs published-artifact consumer integration tests.'

  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  include '**/*IntegrationTest.class'

  dependsOn(rootProject.subprojects.collect {
    "${it.path}:publishToMavenLocal"
  })
  shouldRunAfter(tasks.named('test'))
}

tasks.named('check') {
  dependsOn(tasks.named('integrationTest'))
}
