// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
  alias(libs.plugins.kotlin.jvm) apply false
  alias(libs.plugins.kotlin.serialization) apply false
  alias(libs.plugins.ksp) apply false
}

apply from: 'buildsystem/android-sdk.gradle'

allprojects {
  group = 'com.siimkinks.sqlitemagic'
  version = libs.versions.project.get()

  repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven {
      url "${System.getenv("ANDROID_HOME")}/extras/android/m2repository/"
    }
  }
}

tasks.named('wrapper') {
  version = '9.7.0'
  distributionUrl = "https://services.gradle.org/distributions/gradle-$version-all.zip"
}
