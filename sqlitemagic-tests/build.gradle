// Top-level build file where you can add configuration options common to all sub-projects/modules.

allprojects {
  repositories {
    mavenLocal()
    mavenCentral()
    google()
    maven {
      url "${System.getenv("ANDROID_HOME")}/extras/android/m2repository/"
    }
  }

  // The frozen 0.25.2 snapshot carries Kotlin 2.4 metadata while AGP 9 bundles KGP 2.2.
  // Keep the legacy test artifact usable until that snapshot is rebuilt with the bundled compiler.
  tasks.configureEach { task ->
    if (task.hasProperty('compilerOptions')) {
      task.compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
    }
  }
}

tasks.named('wrapper') {
  version = '9.7.0'
  distributionUrl = "https://services.gradle.org/distributions/gradle-$version-all.zip"
}

tasks.register('runUnitTests') {
  dependsOn([
    'app:testDebugUnitTest',
    'app-kotlin:testDebugUnitTest',
    'multimodule-app:testDemoDebugUnitTest',
    'another-submodule:testDemoDebugUnitTest',
    'submodule:testDemoDebugUnitTest'
  ])
}

tasks.register('runAndroidTests') {
  dependsOn([
    'app:connectedDebugAndroidTest',
    'multimodule-app:connectedDemoDebugAndroidTest'
  ])
}
