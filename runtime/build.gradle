plugins {
  id 'java'
  id 'java-test-fixtures'
  alias(libs.plugins.kotlin.jvm)
}

apply from: '../buildsystem/maven-push.gradle'
apply from: '../buildsystem/bintray-push.gradle'
apply from: '../buildsystem/sqlite-support.gradle'

def mockitoAgentConfiguration = configurations.create('mockitoAgent')

dependencies {
  implementation project(':annotations')

  implementation rootProject.ext.androidJar
  implementation libs.android.annotations
  implementation libs.android.sqlite

  testFixturesImplementation rootProject.ext.androidJar
  testFixturesImplementation libs.android.sqlite
  testFixturesImplementation libs.android.sqlite.bundled.jvm
  testFixturesImplementation libs.mockito.kotlin

  testImplementation libs.junit
  testImplementation libs.mockito.kotlin
  testImplementation libs.truth
  testImplementation libs.android.sqlite.bundled.jvm

  mockitoAgent(libs.mockito) {
    transitive = false
  }
}

kotlin {
  compilerOptions {
    optIn.add('com.siimkinks.sqlitemagic.internal.InternalSqliteMagicApi')
  }
  abiValidation {
    enabled = true
  }
}

components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }

tasks.named('check') {
  dependsOn(kotlin.abiValidation.checkTaskProvider)
}

tasks.withType(Jar).configureEach {
  from(rootProject.file('LICENSE')) {
    into 'META-INF/sqlitemagic'
  }
}

tasks.withType(Test).configureEach {
  scanForTestClasses = false
  include "**/*Test.class"
  jvmArgs "-javaagent:${mockitoAgentConfiguration.singleFile.absolutePath}"
}
