[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
sqlitemagic = "2.0.0-SNAPSHOT"
compose-bom = "2026.09.00"
activity = "1.13.0"
rx-java2 = "2.2.21"
rx-android2 = "2.1.1"
sqlite = "2.7.1"
sqlite-bundled = "2.6.2"
junit = "6.1.3"
android-test-runner = "1.7.0"
android-test-junit = "1.3.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime-rxjava2 = { module = "androidx.compose.runtime:runtime-rxjava2" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
rx-java2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rx-java2" }
rx-android2 = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rx-android2" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite-bundled" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sqlitemagic = { id = "com.siimkinks.sqlitemagic", version.ref = "sqlitemagic" }
