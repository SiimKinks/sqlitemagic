dagger = { module = "com.squareup.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.squareup.dagger:dagger-compiler", version.ref = "dagger" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
