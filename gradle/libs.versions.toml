[versions]
agp = "9.4.1"
android-build-tools = "37.0.0"
android-compile-sdk = "37"
android-min-sdk = "24"
android-platform = "android-37.2"
android-target-sdk = "37"
android-test-runner = "1.7.0"
auto-service = "1.1.1"
auto-service-ksp = "1.2.0"
java-version = "21"
junit = "6.1.3"
junit4 = "4.13.2"
junit-runner = "1.3.0"
kotlin = "2.4.20"
kotlin-poet = "2.4.0"
serialization = "1.11.0"
ksp = "2.3.12"
ksp-compile-testing = "0.14.0"
mockito = "5.24.0"
mockito-kotlin = "6.4.0"
project = "2.0.0-SNAPSHOT"
rx-java2 = "2.2.21"
sqlitemagic = "2.0.0-SNAPSHOT"
sqlite = "2.7.1"
sqlite-bundled = "2.6.0"
test-annotations = "1.11.0"
truth = "1.4.5"

[libraries]
android-annotations = { module = "androidx.annotation:annotation", version.ref = "test-annotations" }
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
android-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite-bundled" }
android-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test-runner" }
auto-service-annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "auto-service" }
auto-service-ksp = { module = "dev.zacsweers.autoservice:auto-service-ksp", version.ref = "auto-service-ksp" }
junit = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-runner = { module = "androidx.test.ext:junit", version.ref = "junit-runner" }
kotlin-poet = { module = "com.squareup:kotlinpoet", version.ref = "kotlin-poet" }
kotlin-poet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlin-poet" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-compile-testing = { module = "dev.zacsweers.kctfork:ksp", version.ref = "ksp-compile-testing" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
rx-java2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rx-java2" }
sqlitemagic-annotations = { module = "com.siimkinks.sqlitemagic:sqlitemagic-annotations", version.ref = "sqlitemagic" }
sqlitemagic-compiler = { module = "com.siimkinks.sqlitemagic:sqlitemagic-compiler", version.ref = "sqlitemagic" }
sqlitemagic-runtime = { module = "com.siimkinks.sqlitemagic:sqlitemagic", version.ref = "sqlitemagic" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sqlitemagic = { id = "com.siimkinks.sqlitemagic", version.ref = "sqlitemagic" }
